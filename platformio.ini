; rpi-pico-2 support is not native on PlatformIO yet
; The following GitHub repository contains a PlatformIO platform
; for Raspberry Pi Pico boards, which is used here to build the project.
;
; Tutorial  for succesful instilation -
; https://arduino-pico.readthedocs.io/en/latest/platformio.html

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
lib_deps = alfredosystems/AlfredoCRSF@^2.2
